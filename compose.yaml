services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lol_stats
      POSTGRES_USER: lol
      POSTGRES_PASSWORD: lol
    ports: ["5432:5432"]
    volumes: ["lol-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lol -d lol_stats"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  lol-postgres: {}
